<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{background:radial-gradient(circle at 82% 50%,#2a1608 0,#0B0D10 55%);font-family:"Noto Sans",sans-serif;color:#F4F5F7;position:relative}
  .text{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
  .brand{font-weight:800;font-size:28px;letter-spacing:.5px;color:#FF6A1A}
  .brand img{width:52px;height:52px;border-radius:12px}
  h1{margin:28px 0 18px;font-size:50px;line-height:1.08;font-weight:800;letter-spacing:-1px}
  h1 span{color:#FF6A1A}
  p{margin:0;font-size:21px;color:#A9AFB8;line-height:1.4}
  .gauge{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:300px;height:300px;border-radius:64px;overflow:hidden;box-shadow:0 0 120px rgba(255,106,26,.35)}
  .gauge img{width:100%;height:100%}
</style></head><body>
  <div class="text">
    <div class="brand">TorqDrop</div>
    <h1>Check any used car <span>before you buy</span></h1>
    <p>OBD-II scan, guided checks, AI photo review and a report you can share.</p>
  </div>
  <div class="gauge"><img src="icon.png" alt=""></div>
</body></html>
